name: Used Cars Failure Handling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config.yaml"
      - "requirements.txt"
      - "requirements-api.txt"
      - "api/**"
      - "pipelines/**"
      - "tests/test_failure_handling.py"
      - "tests/test_pipeline_validation.py"
      - ".github/workflows/lab9_failure_tests.yml"

permissions:
  contents: read

jobs:
  failure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_pipeline_validation.py tests/test_failure_handling.py -q